<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management — PaaS Minggu 7</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <span class="badge">Cloudflare Workers + D1 + Express</span>
      <h1>Student Management Dashboard</h1>
      <p>Frontend HTML + CSS + JS &rarr; Express API &rarr; Cloudflare D1 (Fullstack CRUD)</p>
    </header>

    <section class="panel">
      <h2>Form Siswa</h2>
      <form id="student-form">
        <input id="student-id" type="hidden">
        <label>Nama
          <input id="name" required maxlength="80" placeholder="Nama siswa fiktif">
        </label>
        <label>Kelas
          <input id="class-name" required maxlength="30" placeholder="XII SIJA 2">
        </label>
        <div class="form-actions">
          <button id="save-btn" type="submit">Tambah siswa</button>
          <button id="cancel-btn" type="button" hidden>Batal edit</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Daftar Siswa</h2>
        <div class="actions-bar">
          <input id="search-input" type="search" placeholder="Cari nama/kelas..." style="max-width: 220px;">
          <button id="refresh-btn" type="button">Muat ulang data</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 70px;">ID</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th style="width: 170px;">Aksi</th>
            </tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
